# Réglages de Keryx pour Coraza et l'OWASP CRS, lus avant les règles du CRS (ADR-0035).

# Seuils et corps des requêtes. Caddy borne déjà la taille des corps (Caddyfile) ; Coraza n'inspecte que les corps
# ordinaires (2 Mio et un peu de marge), en mémoire, sans fichier temporaire. Les réponses ne sont pas inspectées.
SecRequestBodyLimit 2621440
SecRequestBodyInMemoryLimit 2621440
SecRequestBodyLimitAction Reject
SecResponseBodyAccess Off
SecAuditEngine Off

# Niveau de paranoïa 1 (défaut du CRS) ; méthodes et types de contenu de l'API de Keryx.
SecAction "id:900000,phase:1,pass,nolog,t:none,setvar:tx.blocking_paranoia_level=1"
SecAction "id:900200,phase:1,pass,nolog,t:none,setvar:'tx.allowed_methods=GET HEAD POST PUT PATCH DELETE OPTIONS'"

# Contenu de sécurité par nature (ADR-0035). Ces corps portent des alertes, des journaux, des commandes, des
# indicateurs de compromission, des adresses de connecteurs : le CRS y verrait des attaques à chaque requête. Ils ne
# sont envoyés qu'avec une clé d'API (ingestion) ou une session et un jeton CSRF ; Keryx les valide et les assainit
# lui-même (HTML assaini côté serveur, requêtes SQL paramétrées, CSP stricte). L'adresse, la chaîne de requête et les
# en-têtes restent inspectés ; les routes de connexion, de second facteur et de SSO gardent l'inspection du corps.
SecRule REQUEST_METHOD "@rx ^(?:POST|PUT|PATCH)$" "id:10010,phase:1,pass,nolog,t:none,chain"
	SecRule REQUEST_FILENAME "@rx ^/api/v1/(?:ingest/|tickets/|admin/|politique/|mitre/|templates)" "t:none,ctl:requestBodyAccess=Off"

# Recherche : le texte cherché (q) est souvent lui-même un indicateur (commande, adresse, empreinte, charge).
# 930100 et 930110 lisent l'adresse entière, chaîne de requête comprise : retirées pour ces trois chemins exacts
# (le chemin, fixé par l'expression, ne peut pas contenir de « ../ »).
SecRule REQUEST_FILENAME "@rx ^/api/v1/(?:tickets|links/search|links/suggestions)$" "id:10020,phase:1,pass,nolog,t:none,\
	ctl:ruleRemoveById=930100,\
	ctl:ruleRemoveById=930110,\
	ctl:ruleRemoveTargetByTag=attack-xss;ARGS:q,\
	ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:q,\
	ctl:ruleRemoveTargetByTag=attack-rce;ARGS:q,\
	ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:q,\
	ctl:ruleRemoveTargetByTag=attack-rfi;ARGS:q,\
	ctl:ruleRemoveTargetByTag=attack-injection-php;ARGS:q,\
	ctl:ruleRemoveTargetByTag=attack-injection-generic;ARGS:q,\
	ctl:ruleRemoveTargetByTag=attack-protocol;ARGS:q"

# Site de Keycloak (profil sso, sso-actif.caddy). Les adresses de retour OIDC (redirect_uri, post_logout_redirect_uri)
# et l'émetteur (iss, RFC 9207) ne sont jamais appelées par le serveur : Keycloak les compare exactement aux adresses
# enregistrées pour le client, Keryx compare l'émetteur à celui de sa configuration. La règle 934110 (SSRF) y voit une
# adresse locale dans un déploiement servi par adresse IP ou « localhost » : retirée pour ces trois paramètres.
SecRule REQUEST_FILENAME "@rx ^/(?:realms/[^/]+/protocol/openid-connect/|api/v1/auth/oidc/)" "id:10030,phase:1,pass,nolog,t:none,\
	ctl:ruleRemoveTargetById=934110;ARGS:redirect_uri,\
	ctl:ruleRemoveTargetById=934110;ARGS:post_logout_redirect_uri,\
	ctl:ruleRemoveTargetById=934110;ARGS:iss"

# API d'administration de Keycloak : déjà réservée aux adresses d'administration (sso-actif.caddy) et authentifiée
# par Keycloak ; ses corps décrivent des comptes, des secrets et des adresses (« credentials », « redirectUris ») que
# le CRS prend pour des attaques. Corps des écritures non inspecté, comme l'administration de Keryx.
SecRule REQUEST_METHOD "@rx ^(?:POST|PUT|PATCH)$" "id:10040,phase:1,pass,nolog,t:none,chain"
	SecRule REQUEST_FILENAME "@rx ^/admin/realms/" "t:none,ctl:requestBodyAccess=Off"
