# Publication d'une version : à chaque étiquette vX.Y.Z poussée sur le dépôt.
# Construit l'image de Keryx, la publie sur le registre GitHub (ghcr.io/<compte>/keryx), joint une attestation de
# provenance et une SBOM, signe l'image (cosign, signature sans clé liée à ce workflow), puis crée la version GitHub
# avec la section du CHANGELOG, la SBOM CycloneDX, l'archive des sources et la liste de leurs empreintes, signée.
# Vérifier une image ou les fichiers de la version : docs/publication.md.
name: Publication
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  publier:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # créer la version GitHub
      packages: write        # pousser l'image sur ghcr.io
      id-token: write        # signature sans clé (Sigstore) et attestations
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Une étiquette posée sur un commit qui n'est pas dans main (donc ni relu en demande de fusion, ni passé par les
      # vérifications obligatoires) ne publie rien : l'image serait sinon signée comme une vraie version.
      - name: Étiquette posée sur un commit de main
        run: |
          git fetch --no-tags --quiet origin main
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD \
            || { echo "L'étiquette $GITHUB_REF_NAME ne désigne pas un commit de main : publication refusée."; exit 1; }
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Étiquette « $GITHUB_REF_NAME » : vX.Y.Z attendu."; exit 1; }
      - name: Version cohérente (étiquette, keryx/__init__.py, web/package.json, CHANGELOG)
        id: version
        run: |
          V="${GITHUB_REF_NAME#v}"
          PY=$(python3 -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"', open('keryx/__init__.py').read()).group(1))")
          JS=$(python3 -c "import json;print(json.load(open('web/package.json'))['version'])")
          [ "$V" = "$PY" ] && [ "$V" = "$JS" ] || { echo "Étiquette $V, Python $PY, interface $JS : à aligner."; exit 1; }
          grep -q "^## \[$V\]" CHANGELOG.md || { echo "Pas de section [$V] dans CHANGELOG.md."; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/keryx" >> "$GITHUB_OUTPUT"

      - name: Contrôles du dépôt
        run: python3 scripts/verif_depot.py

      # Programme ISO/IEC 18974 : aucune version publiée avec une vulnérabilité connue, élevée ou critique et
      # corrigeable, dans ses dépendances ou dans son image (docs/programme-securite-open-source.md).
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Audit des dépendances
        run: |
          pip install --require-hashes -r requirements-outils.lock
          pip-audit --strict -r requirements.lock
          (cd web && npm audit --omit=dev --audit-level=high)

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et publier l'image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          provenance: mode=max
          sbom: true

      # Analyse de l'image publiée elle-même, par son empreinte, avant toute attestation ou signature : en cas d'échec,
      # l'image reste non signée (refusée par install.sh) et aucune version GitHub n'est créée.
      - name: Analyse de l'image publiée (Grype)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ steps.version.outputs.image }}@${{ steps.build.outputs.digest }}
          only-fixed: true
          severity-cutoff: high
          fail-build: true
          output-format: table

      - name: Attestation de provenance (GitHub)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.version.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4      # même version que l'image de cosign épinglée dans deploy/docker/install.sh
      - name: Signer l'image (par empreinte, jamais par étiquette)
        run: cosign sign --yes "${{ steps.version.outputs.image }}@${{ steps.build.outputs.digest }}"
      # La signature est vérifiée ici exactement comme install.sh la vérifiera (émetteur, déclencheur, identité du
      # workflow sur une étiquette vX.Y.Z) : une signature que l'installation refuserait arrête la publication avant
      # la création de la version GitHub.
      - name: Vérifier la signature de l'image comme install.sh
        env:
          REF: ${{ steps.version.outputs.image }}@${{ steps.build.outputs.digest }}
          REPO: ${{ github.repository }}
        run: |
          REPO_RE=$(printf '%s' "$REPO" | sed 's/\./\\./g')
          cosign verify "$REF" --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-github-workflow-trigger push \
            --certificate-identity-regexp "(?i)^https://github\.com/$REPO_RE/\.github/workflows/publication\.yml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+\$" > /dev/null

      - name: SBOM CycloneDX du dépôt
        run: python3 scripts/sbom.py sbom.cdx.json

      - name: Archive des sources, liste d'empreintes signée
        run: |
          V="${{ steps.version.outputs.version }}"
          git archive --format=tar.gz --prefix="keryx-$V/" -o "keryx-$V-sources.tar.gz" "$GITHUB_SHA"
          sha256sum "keryx-$V-sources.tar.gz" sbom.cdx.json > SHA256SUMS
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
          REPO_RE=$(printf '%s' "$GITHUB_REPOSITORY" | sed 's/\./\\./g')
          cosign verify-blob SHA256SUMS --bundle SHA256SUMS.sigstore.json \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-github-workflow-trigger push \
            --certificate-identity-regexp "(?i)^https://github\.com/$REPO_RE/\.github/workflows/publication\.yml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+\$"

      - name: Attestation de provenance des fichiers de la version
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            keryx-${{ steps.version.outputs.version }}-sources.tar.gz
            sbom.cdx.json
      - name: Provenance jointe à la version
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$BUNDLE" "keryx-${{ steps.version.outputs.version }}.intoto.jsonl"

      - name: Notes de version (section du CHANGELOG)
        run: |
          V="${{ steps.version.outputs.version }}"
          awk -v v="## [$V]" 'index($0, v) == 1 {on=1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          {
            echo
            echo "Image : \`${{ steps.version.outputs.image }}:$V\`"
            echo "Empreinte : \`${{ steps.build.outputs.digest }}\`"
            echo
            echo "Vérification de la signature : voir docs/publication.md."
          } >> notes.md

      - name: Créer la version GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.version.outputs.version }}"
          gh release create "$GITHUB_REF_NAME" --title "Keryx $V" --notes-file notes.md \
            sbom.cdx.json "keryx-$V-sources.tar.gz" SHA256SUMS SHA256SUMS.sigstore.json "keryx-$V.intoto.jsonl"
