# Veille des vulnérabilités connues après publication (programme ISO/IEC 18974, docs/programme-securite-open-source.md).
# Chaque lundi, et à la demande avant une publication : audit des dépendances de main et analyse de l'image
# reconstruite. Un échec est inscrit au registre (docs/registre-vulnerabilites.md) et traité sous 7 jours.
name: Veille des vulnérabilités
on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependances:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: pip install --require-hashes -r requirements-outils.lock
      - run: for f in requirements.lock requirements-dev.lock requirements-outils.lock; do pip-audit --strict -r "$f"; done
      - run: npm audit --omit=dev --audit-level=high
        working-directory: web
      - run: npm audit --audit-level=high
        working-directory: e2e

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t keryx:veille .
      - name: Vulnérabilités corrigeables, gravité élevée ou critique
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: keryx:veille
          only-fixed: true
          severity-cutoff: high
          fail-build: true
          output-format: table
