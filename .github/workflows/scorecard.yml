# OpenSSF Scorecard : évaluation automatique des pratiques de sécurité du dépôt (protection des branches, épinglage
# des dépendances, permissions, signatures...). Résultat publié sur scorecard.dev (badge du README) et envoyé à
# l'analyse de code de GitHub. Programme ISO/IEC 18974 : docs/programme-securite-open-source.md.
name: Scorecard
on:
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * 2"
  branch_protection_rule:
  workflow_dispatch:

permissions: read-all

jobs:
  analyse:
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # envoyer le résultat à l'analyse de code
      id-token: write          # publier le résultat sur scorecard.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard
          path: scorecard.sarif
          retention-days: 7
      - uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3
        with:
          sarif_file: scorecard.sarif
