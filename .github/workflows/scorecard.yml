# OpenSSF Scorecard : évaluation automatique des pratiques de sécurité du dépôt (protection des branches, épinglage
# des dépendances, permissions, signatures...). Résultat publié sur scorecard.dev (badge du README) et envoyé à
# l'analyse de code de GitHub. Programme ISO/IEC 18974 : docs/programme-securite-open-source.md.
name: Scorecard
on:
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * 2"
  branch_protection_rule:
  workflow_dispatch:

permissions: read-all

jobs:
  analyse:
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # envoyer le résultat à l'analyse de code
      id-token: write          # publier le résultat sur scorecard.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard
          path: scorecard.sarif
          retention-days: 7
      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: scorecard.sarif
