name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    # Demande de fusion : chaque commit porte « Signed-off-by: » de son auteur (CONTRIBUTING.md, DCO).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Attestation DCO de chaque commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          TETE: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/verif_dco.py "$BASE" "$TETE"

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --require-hashes -r requirements.lock && pip install -r requirements-dev.txt
      # Couverture des instructions du paquet keryx : 92 % au 25/11/2026 ; la CI échoue sous 85 %.
      - run: python -m pytest -q --cov=keryx --cov-report=term --cov-fail-under=85

  tests-postgres:
    # Mêmes tests sous PostgreSQL 16 : migrations aller-retour, ingestion concurrente, sauvegarde pg_dump / pg_restore.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Client de la même version majeure que le serveur : un pg_dump plus récent écrit des réglages (ex.
      # transaction_timeout) que PostgreSQL 16 refuse à la restauration. Pris dans le dépôt officiel de PostgreSQL,
      # comme dans le Dockerfile : la distribution de la machine de CI ne le fournit pas toujours.
      - run: |
          sudo apt-get update && sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-16
      - run: pip install --require-hashes -r requirements.lock && pip install -r requirements-dev.txt
      - run: python -m pytest -q
        env:
          KERYX_TEST_PG_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
          KERYX_PG_DUMP: /usr/lib/postgresql/16/bin/pg_dump
          KERYX_PG_RESTORE: /usr/lib/postgresql/16/bin/pg_restore

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm test
        working-directory: web

  analyse-statique:
    # Avertissements traités comme des erreurs : ruff (Python, règles dans ruff.toml). ESLint tourne dans le job web.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff==0.17.6"
      - run: ruff check .

  depot:
    # Aucun secret suivi par git, aucun tiret cadratin dans la documentation Markdown.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/verif_depot.py

  audit-dependances:
    # Vulnérabilités connues des dépendances (bases publiques OSV / PyPI et GitHub Advisory pour npm).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip install pip-audit
      - run: pip-audit --strict -r requirements.lock
      - run: npm audit --omit=dev --audit-level=high
        working-directory: web
      - run: npm audit --audit-level=high
        working-directory: e2e

  e2e:
    # Parcours dans un navigateur (Chrome sans tête) : connexion + 2FA, administration, travail quotidien,
    # pilotage, conformité, contrôle d'accessibilité automatisé.
    runs-on: ubuntu-latest
    needs: [tests, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip install --require-hashes -r requirements.lock
      - run: npm ci && npm run build
        working-directory: web
      - run: npm ci
        working-directory: e2e
      - run: node run.mjs
        working-directory: e2e
        env:
          KERYX_PYTHON: python
          CHROME_PATH: /usr/bin/google-chrome

  sbom-image:
    runs-on: ubuntu-latest
    needs: [tests, web]
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/sbom.py sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
      - run: docker build -t keryx:ci .
