name: CI
on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --require-hashes -r requirements.lock && pip install -r requirements-dev.txt
      - run: python -m pytest -q
        env:
          PYTHONWARNINGS: ignore

  tests-postgres:
    # Mêmes tests sous PostgreSQL 16 : migrations aller-retour, ingestion concurrente, sauvegarde pg_dump / pg_restore.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: pip install --require-hashes -r requirements.lock && pip install -r requirements-dev.txt
      - run: python -m pytest -q
        env:
          PYTHONWARNINGS: ignore
          KERYX_TEST_PG_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web

  e2e:
    # Parcours dans un navigateur (Chrome sans tête) : connexion + 2FA, administration, travail quotidien,
    # pilotage, conformité, contrôle d'accessibilité automatisé.
    runs-on: ubuntu-latest
    needs: [tests, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip install --require-hashes -r requirements.lock
      - run: npm ci && npm run build
        working-directory: web
      - run: npm ci
        working-directory: e2e
      - run: node run.mjs
        working-directory: e2e
        env:
          KERYX_PYTHON: python
          CHROME_PATH: /usr/bin/google-chrome

  sbom-image:
    runs-on: ubuntu-latest
    needs: [tests, web]
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/sbom.py sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
      - run: docker build -t keryx:ci .
