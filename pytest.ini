[pytest]
# Un avertissement de dépréciation fait échouer les tests : il est corrigé avant de devenir une panne.
filterwarnings =
    error::DeprecationWarning
    error::PendingDeprecationWarning
    error::FutureWarning
    # Émis par fastapi.testclient lui-même (Starlette recommande httpx2) : rien à corriger côté Keryx.
    ignore:Using `httpx` with `starlette.testclient` is deprecated
